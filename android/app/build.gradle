plugins {
    id 'com.android.application'
}

android {
    namespace 'com.reva.harness'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.reva.harness'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                // Points at the extracted nodejs-mobile release (fetched by CI)
                arguments "-DNODE_LIBS_DIR=${projectDir}/../libs/nodejs"
            }
        }
    }

    // libnode.so per ABI comes from the nodejs-mobile release; the JNI bridge
    // (native-lib) is compiled from src/main/cpp.
    sourceSets {
        main {
            jniLibs.srcDirs = ["${projectDir}/../libs/nodejs/bin"]
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Release builds are signed in CI when the ANDROID_KEYSTORE_BASE64 secret
    // is configured (see .github/workflows/android-build.yml). Locally without
    // signing properties, release builds fall back to unsigned output.
    if (project.hasProperty('REVA_STORE_FILE')) {
        signingConfigs {
            release {
                storeFile file(REVA_STORE_FILE)
                storePassword REVA_STORE_PASSWORD
                keyAlias REVA_KEY_ALIAS
                keyPassword REVA_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('REVA_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zero third-party Java dependencies: WebView shell + embedded Node runtime.
dependencies {}
